          { id: 8, productType: '笔记本', category: 'laptop', title: '笔记本WiFi连接不稳定怎么办？', question: '无线网络经常断连或信号弱', answer: '排查方法：1. 检查路由器是否正常工作；2. 尝试更新无线网卡驱动；3. 调整笔记本位置改善信号；4. 重置网络适配器；5. 检查是否有电磁干扰源。如问题持续，可能需要更换网卡。', priority: 'medium' },
          { id: 9, productType: '笔记本', category: 'laptop', title: '笔记本触摸板失灵如何解决？', question: '笔记本触摸板无法正常使用', answer: '解决步骤：1. 检查是否误触关闭快捷键（如Fn+F9）；2. 更新触摸板驱动程序；3. 在设备管理器中重新启用设备；4. 检查是否有液体进入；5. 如硬件故障，请联系售后维修。', priority: 'high' }
        ];

        const productDocuments = {
            '笔记本': [
                { name: '笔记本产品参数说明书.pdf', url: '#' },
                { name: '笔记本常见问题解答.pdf', url: '#' },
                { name: '笔记本用户手册.pdf', url: '#' }
            ],
            '服务器': [
                { name: '服务器产品参数说明书.pdf', url: '#' },
                { name: '服务器常见问题解答.pdf', url: '#' },
                { name: '服务器用户手册.pdf', url: '#' }
            ],
            '工智助手': [
                { name: '工智助手产品参数说明书.pdf', url: '#' },
                { name: '工智助手常见问题解答.pdf', url: '#' },
                { name: '工智助手用户手册.pdf', url: '#' }
            ]
        };

        const categoryIcons = {
            '笔记本': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="10"/><path d="M4 18h16" stroke-linecap="round"/></svg>',
            '工智助手': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="10" rx="2"/><circle cx="16" cy="11" r="1.5"/><path d="M7 10h2" stroke-linecap="round"/><path d="M7 12h2" stroke-linecap="round"/></svg>',
            '服务器': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        };

        const categoryMap = { 'server': '服务器', 'desktop': '工智助手', 'laptop': '笔记本' };

        let state = {
            searchKeyword: '',
            searchResults: [],
            hasSearched: false,
            selectedProduct: null,
            relatedFaqs: [],
            loading: false,
            route: 'home',
            faqType: ''
        };

        function navigate(route) {
            window.location.hash = route;
            handleRouteChange();
        }

        function handleRouteChange() {
            const hash = window.location.hash.slice(1) || 'home';
            const faqMatch = hash.match(/^faq\/(.+)$/);
            if (faqMatch) {
                const type = categoryMap[faqMatch[1]];
                if (type) {
                    state.route = 'faq';
                    state.faqType = type;
                    state.hasSearched = false;
                    state.selectedProduct = null;
                } else {
                    state.route = 'home';
                }
            } else if (hash === 'home') {
                state.route = 'home';
                state.hasSearched = false;
                state.selectedProduct = null;
                state.searchKeyword = '';
                state.searchResults = [];
            } else {
                state.route = 'home';
            }
            render();
        }

        function search(keyword) {
            if (!keyword.trim()) return;
            state.loading = true;
            render();
            const searchKeyword = keyword.trim().toLowerCase();
            state.searchResults = products.filter(p =>
                p.serialNumber?.toLowerCase().includes(searchKeyword)
            );
            state.hasSearched = true;
            state.selectedProduct = null;
            state.relatedFaqs = [];
            state.loading = false;
            render();
        }

        function loadProductDetail(id) {
            const product = products.find(p => p.id === parseInt(id));
            if (!product) return;
            state.selectedProduct = product;
            state.relatedFaqs = faqs.filter(f => f.productType === product.productType);
            render();
        }

        function renderHeader() {
            return '<header class="header"><div class="container"><div class="header-inner">' +
                '<a class="logo" onclick="navigate(\'home\')">浪潮云洲</a>' +
                '<nav class="nav">' +
                '<a href="#home">首页</a><span class="nav-sep">|</span>' +
                '<a href="javascript:void(0)" onclick="openDocumentModal(\'笔记本\')">笔记本</a>' +
                '<a href="javascript:void(0)" onclick="openDocumentModal(\'服务器\')">服务器</a>' +
                '<a href="javascript:void(0)" onclick="openDocumentModal(\'工智助手\')">工智助手</a>' +
                '</nav></div></div></header>';
        }

        function renderSearch() {
            return '<section class="search-section"><div class="container"><div class="search-inner">' +
                '<p class="search-desc">您可以在下框中通过主机序列号，获得与产品相关的所有下载信息</p>' +
                '<div class="search-bar">' +
                '<input type="text" id="searchInput" value="' + state.searchKeyword.replace(/"/g, '&quot;') + '" placeholder="请输入主机序列号" class="search-input" />' +
                '<button onclick="handleSearch()" class="search-btn">' + (state.loading ? '查询中...' : '查询') + '</button>' +
                '</div></div></section>';
        }

        function renderBackButton(text, target) {
            return '<button class="back-btn" onclick="navigate(\'' + target + '\')">← ' + text + '</button>';
        }

        function renderProductDetail(product) {
            // 保修信息
            var warrantyHtml = '';
            if (product.warranty) {
                warrantyHtml = '<div class="detail-section"><h3 class="detail-section-title">保修信息</h3>';
                warrantyHtml += '<div class="warranty-box"><div class="warranty-grid">';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机序号：</span><span class="warranty-value">' + product.warranty.machineSerial + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机机型：</span><span class="warranty-value">' + product.warranty.machineModel + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机系列：</span><span class="warranty-value">' + product.warranty.machineSeries + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">出厂日期：</span><span class="warranty-value">' + product.warranty.factoryDate + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">保修截止日期：</span><span class="warranty-value">' + product.warranty.warrantyEndDate + '</span></div>';
                warrantyHtml += '</div></div></div>';
            }

            // 驱动下载
            var driverHtml = '<div class="detail-section"><h3 class="detail-section-title">驱动下载</h3>';
            driverHtml += '<div class="drivers-table"><table><thead><tr>';
            driverHtml += '<th>驱动名称</th><th>驱动说明</th><th>操作</th>';
            driverHtml += '</tr></thead><tbody>';
            if (product.drivers && product.drivers.length > 0) {
                product.drivers.forEach(function(d) {
                    driverHtml += '<tr>';
                    driverHtml += '<td>' + d.name + '</td>';
                    driverHtml += '<td>' + d.desc + '</td>';
                    driverHtml += '<td><a href="' + d.url + '" class="download-btn" download>下载</a></td>';
                    driverHtml += '</tr>';
                });
            } else {
                driverHtml += '<tr><td colspan="3" class="no-driver">无相关数据。</td></tr>';
            }
            driverHtml += '</tbody></table></div></div>';

            return '<div class="fade-in">' +
                renderBackButton('返回查询结果', 'home') +
                warrantyHtml +
                driverHtml +
                '</div>';
        }

        function renderSearchResults() {
            if (state.searchResults.length === 0) {
                return '<div class="no-results"><p>未找到匹配的产品信息</p><small>请检查输入内容后重试</small></div>';
            }
            var rows = '';
            state.searchResults.forEach(function(p) {
                var driverName = p.drivers && p.drivers.length > 0 ? p.drivers[0].name : '';
                rows += '<tr>' +
                    '<td>' + p.serialNumber + '</td>' +
                    '<td>' + (p.warranty ? p.warranty.machineModel : '') + '</td>' +
                    '<td>' + (p.warranty ? p.warranty.machineSeries : '') + '</td>' +
                    '<td>' + (p.warranty ? p.warranty.factoryDate : '') + '</td>' +
                    '<td>' + (p.warranty ? p.warranty.warrantyEndDate : '') + '</td>' +
                    '<td>' + driverName + '</td>' +
                    '<td><button class="link-btn" onclick="handleProductClick(' + p.id + ')">详情</button></td>' +
                    '</tr>';
            });
            return '<div class="results-table"><table><thead><tr>' +
                '<th>主机序列号</th><th>主机机型</th><th>主机系列</th><th>出厂日期</th><th>保修日期</th><th>驱动/软件名称</th><th>操作</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        }

        function renderResultsSection() {
            if (!state.hasSearched) return '';
            var content;
            if (state.selectedProduct) {
                content = renderProductDetail(state.selectedProduct);
            } else {
                content = '<h2 class="results-title">查询结果</h2>' + renderSearchResults();
            }
            return '<section class="results-section"><div class="container"><div class="results-inner">' + content + '</div></div></section>';
        }

        function renderFaqPage() {
            var type = state.faqType;
            var typeFaqs = faqs.filter(function(f) { return f.productType === type; });
            var bodyHtml;
            if (typeFaqs.length === 0) {
                bodyHtml = '<div class="empty-state">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
                    '<p>暂无' + type + '相关的常见问题</p>' +
                    '<small>我们会持续更新，敬请期待</small></div>';
            } else {
                bodyHtml = '<div class="faq-list">';
                typeFaqs.forEach(function(faq) {
                    bodyHtml += '<div class="faq-item">' +
                        '<h4 class="faq-item-title">' + faq.title + '</h4>' +
                        '<p class="faq-item-question">' + faq.question + '</p>' +
                        '<p class="faq-item-answer">' + faq.answer + '</p>' +
                        '</div>';
                });
                bodyHtml += '</div>';
            }
            return '<section class="faq-page-section"><div class="container"><div class="faq-page-inner">' +
                renderBackButton('返回首页', 'home') +
                '<h2 class="faq-page-title">' + type + ' - 常见问题</h2>' +
                bodyHtml +
                '</div></div></section>';
        }

        function renderContact() {
            return '<section class="contact-section"><div class="container"><div class="contact-inner">' +
                '<h2 class="contact-title">售后服务联系</h2>' +
                '<div class="contact-grid">' +
                '<div class="contact-item">' +
                '<div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
                '<div class="contact-item-title">服务器/笔记本售后联系电话</div>' +
                '<div class="contact-item-desc"><span class="contact-phone">4006245688 转 3</span></div>' +
                '</div>' +
                '<div class="contact-item">' +
                '<div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01" stroke-linecap="round"/><path d="M9 6h6" stroke-linecap="round"/><path d="M9 10h6" stroke-linecap="round"/></svg></div>' +
                '<div class="contact-item-title">服务器/笔记本售后服务电话</div>' +
                '<div class="contact-item-desc"><span class="contact-phone">18865925931</span></div>' +
                '</div>' +
                '<div class="contact-item">' +
                '<div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="10" rx="2"/><circle cx="16" cy="11" r="1.5"/><path d="M7 10h2" stroke-linecap="round"/><path d="M7 12h2" stroke-linecap="round"/></svg></div>' +
                '<div class="contact-item-title">工智助手售后服务电话</div>' +
                '<div class="contact-item-desc"><span class="contact-phone">15165058228</span></div>' +
                '</div>' +
                '</div></div></section>';
        }

        function renderFaqCategories() {
            var categories = [
                { type: '笔记本', route: 'faq/laptop', desc: '笔记本电脑相关问题和解决方案' },
                { type: '服务器', route: 'faq/server', desc: '服务器产品相关问题和解决方案' },
                { type: '工智助手', route: 'faq/desktop', desc: '工智助手产品相关问题和解决方案' }
            ];
            var cards = '';
            categories.forEach(function(item) {
                cards += '<div class="faq-card-link" onclick="openDocumentModal(\'' + item.type + '\')" style="cursor:pointer">' +
                    '<div class="faq-card"><div class="faq-card-inner">' +
                    '<div class="faq-card-content">' +
                    '<div class="faq-card-icon">' + (categoryIcons[item.type] || '') + '</div>' +
                    '<span class="faq-card-label">' + item.type + '</span>' +
                    '</div></div></div>' +
                    '<p class="faq-card-desc">' + item.desc + '</p></div>';
            });
            return '<section class="faq-section"><div class="container">' +
                '<h2 class="faq-title">常见问题</h2>' +
                '<div class="faq-grid">' + cards + '</div>' +
                '</div></section>';
        }

        function renderFooter() {
            return '<footer class="footer"><div class="footer-inner">' +
                '<p class="footer-text">&copy; 2026 浪潮云洲 版权所有</p>' +
                '</div></footer>';
        }

        function renderModal() {
            return '<div class="modal-overlay" id="modalOverlay" onclick="closeDocumentModal(event)">' +
                '<div class="modal" onclick="event.stopPropagation()">' +
                '<div class="modal-header">' +
                '<h3 class="modal-title" id="modalTitle"></h3>' +
                '<button class="modal-close" onclick="closeDocumentModal()">&times;</button>' +
                '</div>' +
                '<div class="modal-body">' +
                '<div class="modal-file-list" id="modalFileList"></div>' +
                '</div>' +
                '</div>' +
                '</div>';
        }

        function openDocumentModal(type) {
            var docs = productDocuments[type];
            if (!docs) return;
            document.getElementById('modalTitle').textContent = type + ' - 产品文档';
            var listHtml = '';
            docs.forEach(function(doc) {
                listHtml += '<div class="modal-file-item">' +
                    '<div class="modal-file-info">' +
                    '<div class="modal-file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8"/></svg></div>' +
                    '<span class="modal-file-name">' + doc.name + '</span>' +
                    '</div>' +
                    '<button class="modal-download-btn" onclick="downloadFile(\'' + doc.url + '\')">下载</button>' +
                    '</div>';
            });
            document.getElementById('modalFileList').innerHTML = listHtml;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDocumentModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function downloadFile(url) {
            if (url && url !== '#') {
                window.open(url, '_blank');
            } else {
                alert('该文件暂未上传，敬请期待！');
            }
        }

        function render() {
            var app = document.getElementById('app');
            var isFaqPage = state.route === 'faq';
            var isDetailPage = !!state.selectedProduct;
            var mainContent;
            if (isFaqPage) {
                mainContent = renderHeader() + renderFaqPage();
            } else if (isDetailPage) {
                mainContent = renderHeader() + renderResultsSection();
            } else {
                mainContent = renderHeader() + renderSearch() + renderResultsSection() + renderFaqCategories() + renderContact();
            }
            app.innerHTML = '<div class="pb-16">' + mainContent + '</div>' + renderFooter() + renderModal();
            var input = document.getElementById('searchInput');
            if (input) {
                input.value = state.searchKeyword;
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleSearch();
                });
            }
        }

        function handleSearch() {
            var input = document.getElementById('searchInput');
            state.searchKeyword = input.value;
            search(state.searchKeyword);
        }

        function handleProductClick(id) {
            loadProductDetail(id);
        }

        window.addEventListener('hashchange', handleRouteChange);
        handleRouteChange();
    </script>
</body>
</html>
