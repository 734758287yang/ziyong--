    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; min-height: 100vh; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }

        /* Header */
        .header { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-bottom: 1px solid #e5e7eb; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
        .logo { font-size: 24px; font-weight: 700; color: #2563eb; cursor: pointer; text-decoration: none; }
        .nav { display: flex; gap: 16px; font-size: 14px; }
        .nav a { color: #6b7280; text-decoration: none; }
        .nav a:hover { color: #2563eb; }
        .nav-sep { color: #d1d5db; }

        /* Search */
        .search-section { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-bottom: 1px solid #e5e7eb; }
        .search-inner { padding: 32px 16px; text-align: center; }
        .search-desc { color: #4b5563; margin-bottom: 24px; }
        .search-bar { display: flex; justify-content: center; gap: 8px; max-width: 640px; margin: 0 auto; }
        .search-input { flex: 1; padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 6px 0 0 6px; outline: none; font-size: 14px; }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        .search-btn { padding: 8px 24px; background: #2563eb; color: #fff; border: none; border-radius: 0 6px 6px 0; cursor: pointer; font-size: 14px; }
        .search-btn:hover { background: #1d4ed8; }

        /* Results */
        .results-section { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-bottom: 1px solid #e5e7eb; }
        .results-inner { padding: 24px 16px; }
        .results-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 16px; }
        .results-table { width: 100%; overflow-x: auto; }
        .results-table table { width: 100%; border-collapse: collapse; }
        .results-table th { background: #f3f4f6; padding: 12px 16px; font-size: 14px; font-weight: 600; color: #4b5563; text-align: left; }
        .results-table td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
        .results-table tr:hover td { background: #f9fafb; }
        .link-btn { color: #2563eb; background: none; border: none; cursor: pointer; font-size: 14px; }
        .link-btn:hover { color: #1d4ed8; }
        .no-results { text-align: center; padding: 32px 0; color: #6b7280; }
        .no-results small { display: block; margin-top: 4px; font-size: 12px; }

        /* Back button */
        .back-btn { margin-bottom: 16px; color: #2563eb; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
        .back-btn:hover { color: #1d4ed8; }

        /* Product detail */
        .detail-header { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
        .detail-section { margin-bottom: 24px; }
        .detail-section-title { font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px; }
        .warranty-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
        .warranty-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 768px) { .warranty-grid { grid-template-columns: 1fr 1fr; } }
        .warranty-item { display: flex; flex-direction: column; gap: 4px; }
        .warranty-label { font-size: 12px; color: #6b7280; }
        .warranty-value { font-size: 14px; font-weight: 500; color: #111827; }
        .detail-info { display: flex; flex-direction: column; gap: 12px; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
        .detail-label { color: #6b7280; }
        .detail-value { font-weight: 500; color: #111827; }
        .tab-header { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; }
        .tab-item { padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .tab-item.active { color: #2563eb; border-bottom-color: #2563eb; }
        .tab-item:hover { color: #2563eb; }
        .drivers-table { width: 100%; overflow-x: auto; }
        .drivers-table table { width: 100%; border-collapse: collapse; }
        .drivers-table th { background: #f3f4f6; padding: 12px 16px; font-size: 14px; font-weight: 600; color: #4b5563; text-align: left; }
        .drivers-table td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
        .no-driver { text-align: center; color: #9ca3af; padding: 24px 0; }
        .specs-title { font-size: 16px; font-weight: 600; color: #111827; margin-top: 16px; margin-bottom: 8px; }
        .specs-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f3f4f6; font-size: 12px; text-transform: uppercase; }
        .specs-label { color: #6b7280; }
        .specs-value { font-weight: 500; color: #111827; }

        /* FAQ cards */
        .faq-section { padding: 32px 16px; }
        .faq-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 24px; }
        .faq-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 768px) { .faq-grid { grid-template-columns: repeat(3, 1fr); } }
        .faq-card-link { text-decoration: none; display: block; }
        .faq-card { position: relative; overflow: hidden; border-radius: 8px; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #1f2937 0%, #111827 100%); transition: background 0.2s; }
        .faq-card:hover { background: linear-gradient(135deg, #374151 0%, #1f2937 100%); }
        .faq-card-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .faq-card-content { text-align: center; }
        .faq-card-icon { color: rgba(255,255,255,0.8); margin-bottom: 8px; display: block; }
        .faq-card-icon svg { width: 48px; height: 48px; margin: 0 auto; }
        .faq-card-label { color: #fff; font-size: 18px; font-weight: 600; }
        .faq-card-desc { margin-top: 8px; font-size: 14px; color: #6b7280; text-align: center; }

        /* FAQ page */
        .faq-page-section { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-bottom: 1px solid #e5e7eb; }
        .faq-page-inner { padding: 24px 16px; }
        .faq-page-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 24px; }
        .faq-list { display: flex; flex-direction: column; gap: 16px; }
        .faq-item { padding: 16px; background: #f9fafb; border-radius: 8px; }
        .faq-item-title { font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 8px; }
        .faq-item-question { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .faq-item-answer { font-size: 14px; color: #374151; line-height: 1.6; }
        .empty-state { text-align: center; padding: 48px 0; color: #9ca3af; }
        .empty-state svg { width: 64px; height: 64px; margin: 0 auto 16px; }
        .empty-state p { font-size: 18px; }
        .empty-state small { display: block; margin-top: 8px; font-size: 14px; }

        /* Footer */
        .footer { background: #1f2937; color: #fff; padding: 24px 0; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
        .footer-inner { text-align: center; padding: 0 16px; }
        .footer-text { color: #9ca3af; font-size: 14px; }

        /* Spacing */
        .pb-16 { padding-bottom: 64px; }

        function navigate(route) {
            window.location.hash = route;
            handleRouteChange();
        }

        function handleRouteChange() {
            const hash = window.location.hash.slice(1) || 'home';
            const faqMatch = hash.match(/^faq\/(.+)$/);
            if (faqMatch) {
                const type = categoryMap[faqMatch[1]];
                if (type) {
                    state.route = 'faq';
                    state.faqType = type;
                    state.hasSearched = false;
                    state.selectedProduct = null;
                } else {
                    state.route = 'home';
                }
            } else if (hash === 'home') {
                state.route = 'home';
                state.hasSearched = false;
                state.selectedProduct = null;
                state.searchKeyword = '';
                state.searchResults = [];
            } else {
                state.route = 'home';
            }
            render();
        }

            if (!keyword.trim()) return;
            state.loading = true;
            render();

            state.searchResults = products.filter(p =>

                p.productModel?.toLowerCase().includes(searchKeyword) ||
                p.partModel?.toLowerCase().includes(searchKeyword) ||
                p.productType?.toLowerCase().includes(searchKeyword) ||
                p.productSeries?.toLowerCase().includes(searchKeyword)
            );
            state.hasSearched = true;
            state.selectedProduct = null;
            state.relatedFaqs = [];
            state.loading = false;
            render();
        }

                '<a href="#faq/server">服务器</a>' +
                '</nav></div></div></header>';
        }

        function renderSearch() {
            return '<section class="search-section"><div class="container"><div class="search-inner">' +
                '<p class="search-desc">您可以在下框中通过主机序列号、产品型号、部件型号，获得与产品相关的所有下载信息</p>' +
                '<div class="search-bar">' +
                '<input type="text" id="searchInput" value="' + state.searchKeyword.replace(/"/g, '&quot;') + '" placeholder="请输入主机序列号/产品型号/部件型号" class="search-input" />' +
                '<button onclick="handleSearch()" class="search-btn">' + (state.loading ? '查询中...' : '查询') + '</button>' +
                '</div></div></section>';
        }

        function renderBackButton(text, target) {
            return '<button class="back-btn" onclick="navigate(\'' + target + '\')">← ' + text + '</button>';
        }

        function renderProductDetail(product) {
            var specs = product.specs ? Object.entries(product.specs) : [];
            var specsHtml = '';
            if (specs.length > 0) {
                specsHtml = '<div class="detail-section"><h3 class="detail-section-title">产品规格</h3><div class="detail-info">';
                specs.forEach(function(s) {
                    specsHtml += '<div class="detail-row"><span class="detail-label">' + s[0] + '</span><span class="detail-value">' + s[1] + '</span></div>';
                });
                specsHtml += '</div></div>';
            }

            // 保修信息
            var warrantyHtml = '';
            if (product.warranty) {
                warrantyHtml = '<div class="detail-section"><h3 class="detail-section-title">保修信息</h3>';
                warrantyHtml += '<div class="warranty-box"><div class="warranty-grid">';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机序号：</span><span class="warranty-value">' + product.warranty.machineSerial + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机机型：</span><span class="warranty-value">' + product.warranty.machineModel + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">主机系列：</span><span class="warranty-value">' + product.warranty.machineSeries + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">出厂日期：</span><span class="warranty-value">' + product.warranty.factoryDate + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">保修截止日期：</span><span class="warranty-value">' + product.warranty.warrantyEndDate + '</span></div>';
                warrantyHtml += '<div class="warranty-item"><span class="warranty-label">现场服务截止日期：</span><span class="warranty-value">' + (product.warranty.onSiteServiceEndDate || '-') + '</span></div>';
                warrantyHtml += '</div></div></div>';
            }

            // 驱动下载
            var driverHtml = '<div class="detail-section"><div class="tab-header"><span class="tab-item active">驱动下载</span><span class="tab-item">常见问题</span></div>';
            driverHtml += '<div class="drivers-table"><table><thead><tr>';
            driverHtml += '<th>驱动名称</th><th>驱动说明</th><th>操作</th>';
            driverHtml += '</tr></thead><tbody><tr>';
            driverHtml += '<td colspan="3" class="no-driver">无相关数据。</td>';
            driverHtml += '</tr></tbody></table></div></div>';

            return '<div class="fade-in">' +
                renderBackButton('返回查询结果', 'home') +
                '<div class="detail-header">产品名称：' + product.productName + '</div>' +
                warrantyHtml +
                driverHtml +
                specsHtml +
                '</div>';
        }

        function renderSearchResults() {
            if (state.searchResults.length === 0) {
                return '<div class="no-results"><p>未找到匹配的产品信息</p><small>请检查输入内容后重试</small></div>';
            }
            var rows = '';
            state.searchResults.forEach(function(p) {
                rows += '<tr>' +
                    '<td>' + p.serialNumber + '</td>' +
                    '<td>' + p.productModel + '</td>' +
                    '<td>' + p.productType + '</td>' +
                    '<td>' + p.productSeries + '</td>' +
                    '<td>' + p.partModel + '</td>' +
                    '<td><button class="link-btn" onclick="handleProductClick(' + p.id + ')">详情</button></td>' +
                    '</tr>';
            });
            return '<div class="results-table"><table><thead><tr>' +
                '<th>主机序列号</th><th>产品型号</th><th>产品类型</th><th>产品系列</th><th>驱动/软件名称</th><th>操作</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        }

        function renderResultsSection() {
            if (!state.hasSearched) return '';
            var content;
            if (state.selectedProduct) {
                content = renderProductDetail(state.selectedProduct);
            } else {
                content = '<h2 class="results-title">查询结果</h2>' + renderSearchResults();
            }
            return '<section class="results-section"><div class="container"><div class="results-inner">' + content + '</div></div></section>';
        }

        function renderFaqPage() {
            var type = state.faqType;
            var typeFaqs = faqs.filter(function(f) { return f.productType === type; });
            var bodyHtml;
            if (typeFaqs.length === 0) {
                bodyHtml = '<div class="empty-state">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
                    '<p>暂无' + type + '相关的常见问题</p>' +
                    '<small>我们会持续更新，敬请期待</small></div>';
            } else {
                bodyHtml = '<div class="faq-list">';
                typeFaqs.forEach(function(faq) {
                    bodyHtml += '<div class="faq-item">' +
                        '<h4 class="faq-item-title">' + faq.title + '</h4>' +
                        '<p class="faq-item-question">' + faq.question + '</p>' +
                        '<p class="faq-item-answer">' + faq.answer + '</p>' +
                        '</div>';
                });
                bodyHtml += '</div>';
            }
            return '<section class="faq-page-section"><div class="container"><div class="faq-page-inner">' +
                renderBackButton('返回首页', 'home') +
                '<h2 class="faq-page-title">' + type + ' - 常见问题</h2>' +
                bodyHtml +
                '</div></div></section>';
        }

        function renderFaqCategories() {
            var categories = [
                { type: '笔记本', route: 'faq/laptop', desc: '笔记本电脑相关问题和解决方案' },
                { type: '台式机', route: 'faq/desktop', desc: '台式机产品相关问题和解决方案' },
                { type: '服务器', route: 'faq/server', desc: '服务器产品相关问题和解决方案' }
            ];
            var cards = '';
            categories.forEach(function(item) {
                cards += '<a href="#' + item.route + '" class="faq-card-link">' +
                    '<div class="faq-card"><div class="faq-card-inner">' +
                    '<div class="faq-card-content">' +
                    '<div class="faq-card-icon">' + (categoryIcons[item.type] || '') + '</div>' +
                    '<span class="faq-card-label">' + item.type + '</span>' +
                    '</div></div></div>' +
                    '<p class="faq-card-desc">' + item.desc + '</p></a>';
            });
            return '<section class="faq-section"><div class="container">' +
                '<h2 class="faq-title">常见问题</h2>' +
                '<div class="faq-grid">' + cards + '</div>' +
                '</div></section>';
        }

        function renderFooter() {
            return '<footer class="footer"><div class="footer-inner">' +
                '<p class="footer-text">&copy; 2026 浪潮云洲 版权所有</p>' +
                '</div></footer>';
        }

        function render() {
            var app = document.getElementById('app');
            var isFaqPage = state.route === 'faq';
            var isDetailPage = !!state.selectedProduct;
            var mainContent;
            if (isFaqPage) {
                mainContent = renderHeader() + renderFaqPage();
            } else if (isDetailPage) {
                mainContent = renderHeader() + renderResultsSection();
            } else {
                mainContent = renderHeader() + renderSearch() + renderResultsSection() + renderFaqCategories();
            }
            app.innerHTML = '<div class="pb-16">' + mainContent + '</div>' + renderFooter();
            var input = document.getElementById('searchInput');
            if (input) {
                input.value = state.searchKeyword;
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleSearch();
                });
            }
        }

        function handleSearch() {
            var input = document.getElementById('searchInput');
            state.searchKeyword = input.value;
            search(state.searchKeyword);
        }

        function handleProductClick(id) {
            loadProductDetail(id);
        }

        window.addEventListener('hashchange', handleRouteChange);
        handleRouteChange();
    </script>
</body>
</html>
